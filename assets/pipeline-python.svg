<svg xmlns="http://www.w3.org/2000/svg" width="206" height="164" viewBox="0 0 206 164" fill="none" role="img" aria-label="Python e R — Ciência de Dados">
  <defs>
    <linearGradient id="cardBg" x1="10" y1="8" x2="196" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#ECFEFF" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="10" y1="8" x2="196" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <radialGradient id="caustic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="tileGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#CFFAFE" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.065"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .tile-float { animation: floatTile 4.4s ease-in-out 0.7s infinite; }
      @keyframes floatTile {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4.5px); }
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="190" height="146" rx="20" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.35"/>
  </g>
  <line x1="28" y1="9.5" x2="178" y2="9.5" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.95"/>
  <ellipse cx="103" cy="82" rx="52" ry="20" fill="url(#caustic)"/>

  <!-- 3D Isometric Glass Platform + Python/Data Code Glyph -->
  <g class="tile-float">
    <path d="M103 48 L145 67 L103 86 L61 67 Z" fill="url(#tileBase)" fill-opacity="0.88"/>
    <path d="M61 67 L103 86 L103 93 L61 74 Z" fill="#0E7490" fill-opacity="0.72"/>
    <path d="M145 67 L103 86 L103 93 L145 74 Z" fill="#0891B2" fill-opacity="0.58"/>
    <path d="M103 34 L145 53 L103 72 L61 53 Z" fill="url(#tileGlass)" stroke="#FFFFFF" stroke-width="1.3"/>
    <!-- Stylized dual-tone Python & Data nodes -->
    <rect x="93" y="42" width="16" height="10" rx="4" fill="#0284C7"/>
    <circle cx="97.5" cy="46.5" r="1.4" fill="#FFFFFF"/>
    <rect x="97" y="54" width="16" height="10" rx="4" fill="#10B981"/>
    <circle cx="108.5" cy="59.5" r="1.4" fill="#FFFFFF"/>
  </g>

  <text x="103" y="118" text-anchor="middle" class="font" font-size="15.5" font-weight="800" letter-spacing="-0.3" fill="#0F172A">Python / R</text>
  <text x="103" y="137" text-anchor="middle" class="font" font-size="11.5" font-weight="500" fill="#64748B">Ciência de Dados</text>
</svg>
