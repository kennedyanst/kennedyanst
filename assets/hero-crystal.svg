<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none" role="img" aria-label="Kennedy Anderson — Data Analyst &amp; Analytics Engineer">
  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6FAFC"/>
      <stop offset="52%" stop-color="#F2F8FB"/>
      <stop offset="100%" stop-color="#EFFAF5"/>
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#34D399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassFill" x1="16" y1="14" x2="884" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#F8FCFE" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#F1FBF7" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="16" y1="14" x2="884" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="38%" stop-color="#BAE6FD" stop-opacity="0.85"/>
      <stop offset="76%" stop-color="#A7F3D0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="55%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#E0F7FA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="prismFaceA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="prismFaceB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.74"/>
    </linearGradient>

    <linearGradient id="prismFaceC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="pillFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#F0F9FF" stop-opacity="0.82"/>
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.06"/>
    </filter>

    <filter id="prismShadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0891B2" flood-opacity="0.24"/>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="14" y="14" width="872" height="232" rx="24"/>
    </clipPath>

    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .prism-float { animation: float3d 5.2s ease-in-out infinite; transform-origin: 760px 124px; }
      .ring-orbit { animation: orbitSpin 18s linear infinite; transform-origin: 760px 126px; }
      .pulse-dot { animation: dotPulse 2.6s ease-in-out infinite; transform-origin: 64px 55px; }
      .sheen-bar { animation: sheenSweep 8s ease-in-out infinite; }
      .spark-a { animation: sparkFloat 4s ease-in-out infinite; }
      .spark-b { animation: sparkFloat 4.8s ease-in-out 1.2s infinite; }

      @keyframes float3d {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1.5deg); }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.35); }
      }
      @keyframes sheenSweep {
        0%, 62% { transform: translateX(-340px); opacity: 0; }
        74% { opacity: 0.7; }
        100% { transform: translateX(1080px); opacity: 0; }
      }
      @keyframes sparkFloat {
        0%, 100% { transform: translateY(0px); opacity: 0.55; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Ambient canvas with soft refractive orbs -->
  <rect width="900" height="260" rx="28" fill="url(#bgWash)"/>
  <circle cx="755" cy="88" r="115" fill="url(#orbCyan)" filter="url(#softBlur)"/>
  <circle cx="665" cy="198" r="95" fill="url(#orbEmerald)" filter="url(#softBlur)"/>
  <circle cx="135" cy="54" r="88" fill="url(#orbCyan)" filter="url(#softBlur)" opacity="0.55"/>

  <!-- Main Liquid Glass Card -->
  <g filter="url(#cardShadow)">
    <rect x="14" y="14" width="872" height="232" rx="24" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.4"/>
  </g>

  <!-- Specular inner rim + subtle animated glass sheen -->
  <g clip-path="url(#cardClip)">
    <line x1="36" y1="15.5" x2="864" y2="15.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.92"/>
    <rect class="sheen-bar" x="-160" y="-20" width="180" height="300" transform="skewX(-22)" fill="url(#sheenGrad)"/>
  </g>

  <!-- Top Kicker Pill -->
  <g>
    <rect x="48" y="40" width="246" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBEAF7" stroke-width="1"/>
    <circle class="pulse-dot" cx="64" cy="54" r="4.2" fill="#10B981"/>
    <text x="77" y="58.5" class="font" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0F766E">MULTIVERSE DATA PORTFOLIO</text>
  </g>

  <!-- Headline & Bio -->
  <text x="48" y="112" class="font" font-size="37" font-weight="800" letter-spacing="-1.1" fill="#0F172A">Kennedy Anderson</text>
  <text x="48" y="140" class="font" font-size="17" font-weight="700" letter-spacing="-0.2" fill="url(#accentText)">Data Analyst &amp; Analytics Engineer</text>
  <text x="48" y="166" class="font" font-size="13.5" font-weight="400" fill="#475569">Biomedicine · Data Science · Data Engineering · UX Design</text>

  <!-- Floating Liquid Glass Certification Pills -->
  <g>
    <!-- DP-600 -->
    <rect x="48" y="186" width="136" height="32" rx="16" fill="url(#pillFill)" stroke="#7DD3FC" stroke-width="1.2"/>
    <circle cx="65" cy="202" r="4" fill="#0EA5E9"/>
    <text x="76" y="206.5" class="font" font-size="12" font-weight="700" fill="#0369A1">Microsoft DP-600</text>

    <!-- DP-700 -->
    <rect x="196" y="186" width="136" height="32" rx="16" fill="url(#pillFill)" stroke="#5EEAD4" stroke-width="1.2"/>
    <circle cx="213" cy="202" r="4" fill="#0D9488"/>
    <text x="224" y="206.5" class="font" font-size="12" font-weight="700" fill="#0F766E">Microsoft DP-700</text>

    <!-- PL-300 -->
    <rect x="344" y="186" width="134" height="32" rx="16" fill="url(#pillFill)" stroke="#6EE7B7" stroke-width="1.2"/>
    <circle cx="361" cy="202" r="4" fill="#10B981"/>
    <text x="372" y="206.5" class="font" font-size="12" font-weight="700" fill="#047857">Microsoft PL-300</text>
  </g>

  <!-- Right 3D Refractive Crystal Prism Sculpture -->
  <g>
    <!-- Soft floor caustic reflection -->
    <ellipse cx="760" cy="208" rx="64" ry="12" fill="#0EA5E9" fill-opacity="0.14"/>
    <ellipse cx="760" cy="208" rx="38" ry="6" fill="#10B981" fill-opacity="0.18"/>

    <!-- Subtle rotating orbit ring -->
    <g class="ring-orbit" opacity="0.55">
      <ellipse cx="760" cy="126" rx="84" ry="30" transform="rotate(-18 760 126)" stroke="url(#accentText)" stroke-width="1.1" stroke-dasharray="5 6"/>
      <circle cx="838" cy="100" r="3.6" fill="#0EA5E9"/>
      <circle cx="682" cy="152" r="3.2" fill="#10B981"/>
    </g>

    <!-- Floating 3D Glass Octahedron / Crystal Prism -->
    <g class="prism-float" filter="url(#prismShadow)">
      <!-- Back translucent facets -->
      <polygon points="760,46 822,124 760,192 698,124" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="1.2"/>
      <!-- Left upper facet -->
      <polygon points="760,46 698,124 760,136" fill="url(#prismFaceC)" stroke="#FFFFFF" stroke-width="1.1"/>
      <!-- Right upper facet -->
      <polygon points="760,46 822,124 760,136" fill="url(#prismFaceA)" stroke="#FFFFFF" stroke-width="1.1"/>
      <!-- Left lower facet -->
      <polygon points="698,124 760,136 760,192" fill="url(#prismFaceA)" fill-opacity="0.78" stroke="#E0F2FE" stroke-width="1"/>
      <!-- Right lower facet -->
      <polygon points="822,124 760,136 760,192" fill="url(#prismFaceB)" stroke="#D1FAE5" stroke-width="1"/>
      <!-- Crisp inner refractive highlight -->
      <polygon points="760,64 786,120 760,128 734,120" fill="#FFFFFF" fill-opacity="0.52"/>
      <line x1="760" y1="46" x2="760" y2="192" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.88"/>
      <line x1="698" y1="124" x2="822" y2="124" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.55"/>
    </g>

    <!-- Ambient glass droplets -->
    <circle class="spark-a" cx="668" cy="78" r="6" fill="#FFFFFF" fill-opacity="0.85" stroke="#BAE6FD" stroke-width="1.2"/>
    <circle class="spark-b" cx="842" cy="170" r="8" fill="#FFFFFF" fill-opacity="0.78" stroke="#A7F3D0" stroke-width="1.2"/>
  </g>
</svg>
