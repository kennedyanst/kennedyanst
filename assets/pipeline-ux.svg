<svg xmlns="http://www.w3.org/2000/svg" width="206" height="164" viewBox="0 0 206 164" fill="none" role="img" aria-label="UX Design — Figma e Produto">
  <defs>
    <linearGradient id="cardBg" x1="10" y1="8" x2="196" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#F0FDF9" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="10" y1="8" x2="196" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#99F6E4"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="caustic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="tileGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#CCFBF1" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.065"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .tile-float { animation: floatTile 4.4s ease-in-out 2.1s infinite; }
      @keyframes floatTile {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4.5px); }
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="190" height="146" rx="20" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.35"/>
  </g>
  <line x1="28" y1="9.5" x2="178" y2="9.5" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.95"/>
  <ellipse cx="103" cy="82" rx="52" ry="20" fill="url(#caustic)"/>

  <!-- 3D Isometric Glass Platform + UX / Figma Geometry -->
  <g class="tile-float">
    <path d="M103 48 L145 67 L103 86 L61 67 Z" fill="url(#tileBase)" fill-opacity="0.88"/>
    <path d="M61 67 L103 86 L103 93 L61 74 Z" fill="#115E59" fill-opacity="0.72"/>
    <path d="M145 67 L103 86 L103 93 L145 74 Z" fill="#0F766E" fill-opacity="0.58"/>
    <path d="M103 34 L145 53 L103 72 L61 53 Z" fill="url(#tileGlass)" stroke="#FFFFFF" stroke-width="1.3"/>
    <!-- Clean geometric UX / Figma blocks -->
    <rect x="94" y="40" width="9" height="8" rx="4" fill="#0284C7"/>
    <rect x="103" y="40" width="9" height="8" rx="4" fill="#8B5CF6"/>
    <rect x="94" y="48.5" width="9" height="8" rx="4" fill="#0D9488"/>
    <circle cx="107.5" cy="52.5" r="4" fill="#06B6D4"/>
    <rect x="94" y="57" width="9" height="8" rx="4" fill="#10B981"/>
  </g>

  <text x="103" y="118" text-anchor="middle" class="font" font-size="15.5" font-weight="800" letter-spacing="-0.3" fill="#0F172A">UX Design</text>
  <text x="103" y="137" text-anchor="middle" class="font" font-size="11.5" font-weight="500" fill="#64748B">Figma &amp; Produto</text>
</svg>
